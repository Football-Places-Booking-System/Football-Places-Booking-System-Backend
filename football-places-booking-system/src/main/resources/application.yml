server:
  port: 8080

spring:
  application:
    name: football-places-booking-system

  datasource:
    url: jdbc:postgresql://localhost:5432/footballPlayer
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update  # Use `update` for automatic schema creation
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    database: postgresql
    database-platform: org.hibernate.dialect.PostgreSQLDialect

  liquibase:
    enabled: false # Temporarily disable liquibase to test manually
    change-log: classpath:/db/changelog/db.changelog-master.yaml

app:
  security:
    jwt:
      secret-key: tzyUDpPD0UdhgKyr0oTRNOL1hGajLHikkatdo29yrGvqfvLm10FcFEvNqT0PNEw1x/MyHN2GJFemFuzoSsRt/w==
      expiration: 86400000  # 1 day in milliseconds
